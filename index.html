```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lanche das Minas 🍔</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🍔 Lanche das Minas</h1>
    </header>


    <main class="container">

        <!-- CARDÁPIO -->
        <section class="card">

            <h2>🍔 Nossos Lanches</h2>

            <p>
                Escolha seu lanche favorito e faça seu pedido!
            </p>

            <div id="vitrine-produtos" class="product-grid">

                <!-- Os produtos do Supabase aparecerão aqui -->

            </div>

        </section>


        <!-- PEDIDO -->
        <section class="card">

            <h2>🛒 Faça seu pedido</h2>

            <form id="form-venda">

                <div class="form-group">

                    <label for="venda-produto">
                        Escolha seu lanche:
                    </label>

                    <select id="venda-produto" required>

                        <option value="">
                            Carregando lanches...
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="venda-qtd">
                        Quantidade:
                    </label>

                    <input
                        type="number"
                        id="venda-qtd"
                        min="1"
                        step="1"
                        value="1"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    🍔 Fazer Pedido
                </button>

            </form>


            <p
                id="mensagem-venda"
                class="mensagem"
                aria-live="polite"
            ></p>

        </section>

    </main>


    <footer>

        <strong>Lanche das Minas ❤️</strong>

        <span>
            Obrigado pela preferência!
        </span>

    </footer>


    <!-- Biblioteca do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- JavaScript do projeto -->
    <script src="script.js"></script>

</body>

</html>
```
